    <!-- Personalized welcome banner styles -->
    <style>
      /* Personalized welcome banner — shown on landing page only */
      #personalized-welcome {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
        background: rgba(245, 241, 232, 0.98);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1.5px solid rgba(26, 122, 74, 0.2);
        border-radius: 24px;
        padding: 2.5rem 3rem;
        max-width: 540px;
        width: calc(100% - 2rem);
        text-align: center;
        box-shadow:
          0 25px 50px -12px rgba(15, 26, 18, 0.25),
          0 10px 20px -5px rgba(15, 26, 18, 0.15);
        animation: pwFadeIn 0.6s ease-out;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }

      @keyframes pwFadeIn {
        from {
          opacity: 0;
          transform: translate(-50%, -45%);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
      }

      #personalized-welcome.pw-closing {
        animation: pwFadeOut 0.4s ease-in forwards;
      }

      @keyframes pwFadeOut {
        from {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -55%);
        }
      }

      #personalized-welcome .pw-eyebrow {
        color: #1a7a4a;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 0.9rem;
      }

      #personalized-welcome .pw-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 900;
        font-size: clamp(1.75rem, 4vw, 2.4rem);
        color: #0f1a12;
        line-height: 1.1;
        margin: 0 0 0.6rem;
      }

      #personalized-welcome .pw-title .pw-accent {
        color: #1a7a4a;
        font-style: italic;
      }

      #personalized-welcome .pw-body {
        color: #566059;
        font-size: 1rem;
        line-height: 1.7;
        margin: 0 0 1.5rem;
      }

      #personalized-welcome .pw-actions {

      #personalized-welcome .pw-btn {

        border-radius: 50px;
        font-size: 0.88rem;

        text-decoration: none;
        cursor: pointer;
        border: 0;
        transition: transform 0.15s ease, background 0.15s ease;

      #personalized-welcome .pw-btn-primary {

      #personalized-welcome .pw-btn-primary:hover {

      #personalized-welcome .pw-btn-secondary {

      #personalized-welcome .pw-close:hover {

      #personalized-welcome-overlay {
        position: fixed;
        inset: 0;

      #personalized-welcome-overlay.pw-closing {

      @keyframes pwOverlayFadeOut {

    <style>
      /* Treatment cards: shift photos down on desktop (Parkinson's onward) */
      /* Each card is rendered as <article id="<treatment-id>">. We override the */
      /* inline style="object-position: center" with !important on >= 768px only. */
      @media (min-width: 768px) {
        /* Parkinson's & Medical Exercise: moderate shift down */
        article#parkinsons > img,
        article#medical-exercise > img {
          object-position: center 25% !important;
        }
        /* Weight Training: unchanged at 85% */
        article#weight-training > img {
          object-position: center 85% !important;
        }
        /* S&C and Sport Massage: bumped up 20% → 65% */
        article#strength-conditioning > img,
        article#sport-massage > img {
          object-position: center 65% !important;
        }
        /* Modalities: bumped up 20% → 60% */
        article#modalities > img {
          object-position: center 60% !important;
        }
        /* Biomechanics and Pain Management: still at bottom */
        article#biomechanics > img,
        article#pain-management > img {
          object-position: center bottom !important;
        }
      }
    </style>

  <body>
    <div id="root"></div>

    <!-- Personalized welcome banner — only shown once on first visit to landing page -->
    <script>
      (function () {
        // Show only on the homepage, and only once per session
        function shouldShowWelcome() {
          if (window.location.pathname !== '/' && window.location.pathname !== '/index.html') {
            return false;
          }
          try {
            return !sessionStorage.getItem('pw-dismissed');
          } catch (e) {
            return true;
          }
        }

        function dismissWelcome() {
          var banner = document.getElementById('personalized-welcome');
          var overlay = document.getElementById('personalized-welcome-overlay');
          if (banner) banner.classList.add('pw-closing');
          if (overlay) overlay.classList.add('pw-closing');
          try {
            sessionStorage.setItem('pw-dismissed', '1');
          } catch (e) {}
          setTimeout(function () {
            if (banner && banner.parentNode) banner.parentNode.removeChild(banner);
            if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
          }, 400);
        }

        function showWelcome() {
          if (!shouldShowWelcome()) return;
          if (document.getElementById('personalized-welcome')) return;

          var overlay = document.createElement('div');
          overlay.id = 'personalized-welcome-overlay';
          overlay.addEventListener('click', dismissWelcome);

          var banner = document.createElement('div');
          banner.id = 'personalized-welcome';
          banner.setAttribute('role', 'dialog');
          banner.setAttribute('aria-labelledby', 'pw-title');
          banner.innerHTML = [
            '<button class="pw-close" aria-label="Close">',
            '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
            '</button>',
            '<div class="pw-eyebrow">Welcome</div>',
            '<h2 class="pw-title" id="pw-title">Care That\'s <span class="pw-accent">Personalized</span> to You</h2>',
            '<p class="pw-body">No cookie-cutter plans. Dr. Uriah builds every program around <em>your</em> body, <em>your</em> goals, and <em>your</em> home — combining 20+ years of elite-level expertise with one-on-one attention from your first session to your full recovery.</p>',
            '<div class="pw-actions">',
            '<a class="pw-btn pw-btn-primary" href="/contact">Book Free Consultation</a>',
            '<button class="pw-btn pw-btn-secondary" type="button">Explore the Site</button>',
            '</div>'
          ].join('');

          banner.querySelector('.pw-close').addEventListener('click', dismissWelcome);
          banner.querySelector('.pw-btn-secondary').addEventListener('click', dismissWelcome);

          // Allow Escape to dismiss
          var escHandler = function (e) {
            if (e.key === 'Escape') {
              dismissWelcome();
              document.removeEventListener('keydown', escHandler);
            }
          };
          document.addEventListener('keydown', escHandler);

          document.body.appendChild(overlay);
          document.body.appendChild(banner);
        }

        // Wait for the React app to mount, then show
        function waitForApp() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            // Give the page a moment to settle visually
            setTimeout(showWelcome, 600);
          } else {
            setTimeout(waitForApp, 100);
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', waitForApp);
        } else {
          waitForApp();
        }
      })();
    </script>

    <!--
      Contact form submission handler.

      The compiled React form has a broken submit handler (it just shows
      "Thanks" without sending anything). This script intercepts the submit,
      pulls values from the form fields, and POSTs them to Formspree, which
      then forwards them to your email.

      ===========================================================================
      SETUP (do this once, takes 2 minutes):
        1) Sign up at https://formspree.io  (free tier: 50 submissions/month)
        2) Create a new form → name it "Contact"
        3) Copy your form endpoint URL — it looks like:
           https://formspree.io/f/abcdwxyz
        4) Replace YOUR_FORMSPREE_ID below with your actual ID (the part after /f/)
      ===========================================================================
    -->
    <script>
      (function () {
        // ---- CONFIG -----------------------------------------------------------
        var FORMSPREE_ID = 'YOUR_FORMSPREE_ID'; // <-- REPLACE THIS
        // -----------------------------------------------------------------------

        document.addEventListener('submit', function (e) {
          var form = e.target;
          if (!form || form.tagName !== 'FORM') return;

          // Only intercept the contact form (button text contains "Send Message")
          var btn = form.querySelector('button[type="submit"]');
          if (!btn || !/send\s*message/i.test(btn.textContent || '')) return;

          // Collect field values in document order (the React form has no
          // name attributes, so we read positionally).
          var fields = form.querySelectorAll('input, select, textarea');
          if (fields.length < 5) return; // structure changed — bail safely

          var data = {
            'Full Name':       (fields[0] && fields[0].value) || '',
            'Email':           (fields[1] && fields[1].value) || '',
            'Phone':           (fields[2] && fields[2].value) || '',
            'Visit Type':      (fields[3] && fields[3].value) || '',
            'Area of Concern': (fields[4] && fields[4].value) || '',
            'Message':         (fields[5] && fields[5].value) || ''
          };

          if (FORMSPREE_ID === 'YOUR_FORMSPREE_ID') {
            console.warn('[contact-form] Formspree ID not configured. Submission discarded. ' +
                         'See setup instructions in index.html.');
            return;
          }

          // Background POST — React still shows its "Thanks" message.
          fetch('https://formspree.io/f/' + FORMSPREE_ID, {
            method: 'POST',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          }).catch(function (err) {
            console.error('[contact-form] Submission failed:', err);
          });
        }, true);
      })();
    </script>
  </body>
